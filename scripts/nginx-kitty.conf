# Kitty Key Studio (reverse-proxied to 127.0.0.1:3005)
server {
    server_name kitty.wowpn.com;

    client_max_body_size 50m;

    location = /lab {
        return 301 /lab/;
    }

    location /lab/ {
        alias /opt/alphamatte-lab/dist/;
        index index.html;
        try_files $uri $uri/ /lab/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    listen 127.0.0.1:10443 ssl;
    ssl_certificate /etc/letsencrypt/live/kitty.wowpn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitty.wowpn.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name kitty.wowpn.com;
    return 301 https://$host$request_uri;
}
