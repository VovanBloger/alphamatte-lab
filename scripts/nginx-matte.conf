# AlphaMatte Lab Subdomains
server {
    server_name matte.wowpn.com alphamatte.wowpn.com lab.wowpn.com;

    client_max_body_size 50m;
    root /opt/alphamatte-lab/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 127.0.0.1:10443 ssl;
    ssl_certificate /etc/letsencrypt/live/kitty.wowpn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitty.wowpn.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name matte.wowpn.com alphamatte.wowpn.com lab.wowpn.com;
    return 301 https://$host$request_uri;
}
